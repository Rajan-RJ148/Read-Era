name: read_era
description: A book discovery app with Firebase integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  
  # Google Sign-In
  google_sign_in: ^6.2.2
  
  # State Management
  provider: ^6.1.2
  
  # UI & Images
  cached_network_image: ^3.4.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Add assets folder for any local images
  # assets:
  #   - assets/images/
